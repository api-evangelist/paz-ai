name: Paz Ai
description: Paz.ai is an AI commerce platform that helps merchants win visibility and
  sales across AI shopping channels such as ChatGPT, Google AI Mode, and Perplexity. It
  runs three autonomous agents — a Monitor agent that benchmarks catalog performance
  across AI channels, an Optimizer agent that enriches product titles, attributes, and
  structured data, and a Distributor agent that publishes AI-optimized feeds to agentic
  commerce endpoints — producing an AI-optimized copy of a product catalog without
  modifying the live store. It integrates with Shopify, Adobe Commerce, and Salesforce
  Commerce, plus CSV and a custom API on enterprise plans. Backed by Mayfield.
